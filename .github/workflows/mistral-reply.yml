name: Mistral Reply to AI Reviews

# Contrasta con Mistral los hallazgos que otras IAs (p. ej. Codex) dejan en los
# PR de este mismo repo. Llama a la versión estable publicada, no a la del PR:
# el script que se ejecuta con la clave es siempre el de una etiqueta fusionada.
# La excepción es un PR que edite este archivo en eventos que usan el workflow
# de la rama del PR. Sin el secreto MISTRAL_API_KEY, el contraste se omite.

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número del PR (puede estar cerrado para un contraste histórico)
        required: true
      review_comment_id:
        description: ID del hallazgo de línea de otra IA al que responder
        required: true

# Serializa eventos repetidos de la misma fuente; las reviews diferentes
# conservan sus propias ejecuciones y no se expulsan de la cola entre sí.
concurrency:
  group: mistral-reply-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}-${{ github.event.review.id || github.event.comment.pull_request_review_id || github.event.comment.id || inputs.review_comment_id }}
  cancel-in-progress: false

jobs:
  mistral-reply:
    permissions:
      contents: read
      pull-requests: write
    uses: novanoticia/mistral-review/.github/workflows/reply.yml@v1.4
    with:
      # Debe coincidir con la etiqueta de `uses:`. Al publicar una versión nueva,
      # cambia las dos a la vez (ver README, «Al publicar una versión»).
      ref: v1.4
      # Proveedor (ver README, «Usar OpenRouter»): sin la variable MISTRAL_PROVIDER,
      # o con `mistral`, revisa Mistral con MISTRAL_MODEL; con `openrouter`, OpenRouter
      # con OPENROUTER_MODEL. Cambiar de proveedor = cambiar solo MISTRAL_PROVIDER.
      model: ${{ vars.MISTRAL_PROVIDER == 'openrouter' && vars.OPENROUTER_MODEL || vars.MISTRAL_PROVIDER != 'openrouter' && vars.MISTRAL_MODEL || '' }}
      # MISTRAL_REPLY_MODEL (opcional) es un modelo de Mistral solo para el contraste;
      # con OpenRouter no se usa y el contraste toma el modelo de la revisión.
      reply_model: ${{ vars.MISTRAL_PROVIDER != 'openrouter' && vars.MISTRAL_REPLY_MODEL || '' }}
      provider: ${{ vars.MISTRAL_PROVIDER }}
      openrouter_provider: ${{ vars.OPENROUTER_PROVIDER }}
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
