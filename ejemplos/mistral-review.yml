# Copia este archivo en .github/workflows/mistral-review.yml del repo que
# quieras revisar. Necesita el secreto MISTRAL_API_KEY y, opcionalmente, la
# variable MISTRAL_MODEL (Settings → Secrets and variables → Actions). Para
# usar OpenRouter en su lugar, ver README (sección «Usar OpenRouter»): no hay
# que tocar este archivo, solo variables y un secreto.
name: Mistral PR Review

on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened, edited]

# Un push nuevo cancela la revisión anterior del mismo PR.
concurrency:
  group: mistral-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mistral-review:
    permissions:
      pull-requests: write
      contents: read
    uses: novanoticia/mistral-review/.github/workflows/review.yml@main
    with:
      # Versión del revisor: `@` de `uses:` y `ref:` deben coincidir. Para fijar
      # una versión estable, cambia las dos a la vez (p. ej. `@v1.5` y `ref: v1.5`).
      ref: main
      # Proveedor (ver README, «Usar OpenRouter»): sin la variable MISTRAL_PROVIDER,
      # o con `mistral`, revisa Mistral con MISTRAL_MODEL; con `openrouter`, OpenRouter
      # con OPENROUTER_MODEL. Cambiar de proveedor = cambiar solo MISTRAL_PROVIDER.
      model: ${{ vars.MISTRAL_PROVIDER == 'openrouter' && vars.OPENROUTER_MODEL || vars.MISTRAL_PROVIDER != 'openrouter' && vars.MISTRAL_MODEL || '' }}
      provider: ${{ vars.MISTRAL_PROVIDER }}
      openrouter_provider: ${{ vars.OPENROUTER_PROVIDER }}
      # Archivos generados que no merece la pena revisar (opcional):
      # excluded: |
      #   tests/golden/**
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
